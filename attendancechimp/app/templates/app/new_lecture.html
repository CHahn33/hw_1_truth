<!DOCTYPE html>
<html>
<head>
    <title>New Lecture</title>
</head>
<body>
    <h1>Create Lecture</h1>
    <form action="/app/createLecture" method="POST">
       {% csrf_token %}
    
       <select name="choice">
            {% for course in courses %}
                <option value="{{ course.name }}">{{ course.name }}</option>
            {% endfor %}
       </select>
       
       <input type="submit" value="Create Lecture">
    </form>
</body>
</html>
